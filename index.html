<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kineta Valerie</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #222;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        .profile {
            margin-bottom: 30px;
        }

        .profile-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            margin: 0 auto 20px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .role {
            color: #666;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .bio {
            color: #555;
            font-size: 14px;
            line-height: 1.6;
            max-width: 450px;
            margin: 0 auto;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link {
            display: block;
            padding: 15px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            text-decoration: none;
            color: #222;
            font-size: 15px;
            transition: 0.2s;
        }

        .link:hover {
            background: #222;
            color: white;
        }

        footer {
            margin-top: 35px;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="links">

            </a>

            <a
                class="link"
